          const b = byId.get(edge[1]);
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const target = 118 - Math.min(edge[2], 12) * 3;
          const force = (distance - target) * 0.0028 * (0.4 + alpha);
          a.vx += dx / distance * force;
          a.vy += dy / distance * force;
          b.vx -= dx / distance * force;
          b.vy -= dy / distance * force;
        });
        positioned.forEach(node => {
          node.vx += (500 - node.x) * 0.0009;
          node.vy += (278 - node.y) * 0.0009;
          node.vx *= 0.78;
          node.vy *= 0.78;
          node.x = Math.max(45, Math.min(955, node.x + node.vx));
          node.y = Math.max(38, Math.min(522, node.y + node.vy));
        });
      }
      return byId;
    }

    function setFocus(id) {
      selected = id;
      const neighbors = new Set(id === null ? [] : [id]);
      const related = edges
        .filter(edge => edge[2] >= threshold && (edge[0] === id || edge[1] === id))
        .sort((a, b) => b[2] - a[2]);
      related.forEach(edge => {
        neighbors.add(edge[0]);
        neighbors.add(edge[1]);
      });
      root.querySelectorAll('.network-node').forEach(element => {
        const nodeId = Number(element.dataset.id);
        element.classList.toggle('is-dimmed', id !== null && !neighbors.has(nodeId));
        element.classList.toggle('is-selected', nodeId === id);
      });
      root.querySelectorAll('.network-label').forEach(element => {
        element.classList.toggle('is-dimmed', id !== null && !neighbors.has(Number(element.dataset.id)));
      });
      root.querySelectorAll('.network-edge').forEach(element => {
        const hit = id !== null && (Number(element.dataset.left) === id || Number(element.dataset.right) === id);
        element.classList.toggle('is-dimmed', id !== null && !hit);
        element.classList.toggle('is-related', hit);
      });
      if (id === null) {
        selection.textContent = '点选节点可查看当前阈值下的主要合作关系。';
        return;
      }
      const strongest = related[0];
      const partnerId = strongest ? (strongest[0] === id ? strongest[1] : strongest[0]) : null;
      selection.innerHTML = '<strong>' + escapeHtml(nodes[id][0]) + '</strong>：合作强度 ' + nodes[id][1] +
        '，当前可见合作伙伴 ' + related.length +
        (strongest ? '；最强合作为 ' + escapeHtml(nodes[partnerId][0]) + '（' + strongest[2] + ' 篇）' : '');
    }

    function showTooltip(id, circle) {
      tooltip.innerHTML = '<strong>' + escapeHtml(nodes[id][0]) + '</strong><br>合作强度 ' + nodes[id][1] +
        ' · 合作伙伴 ' + nodes[id][2];
      tooltip.style.visibility = 'visible';
      const stageBox = root.querySelector('.network-stage').getBoundingClientRect();
      const circleBox = circle.getBoundingClientRect();
      const left = Math.min(stageBox.width - 270, Math.max(0, circleBox.left - stageBox.left + circleBox.width));
      const top = Math.min(stageBox.height - 80, Math.max(0, circleBox.top - stageBox.top + circleBox.height));
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }

    function render() {
      selected = null;
      edgeLayer.replaceChildren();
      nodeLayer.replaceChildren();
      labelLayer.replaceChildren();
      const visibleEdges = edges.filter(edge => edge[2] >= threshold);
      const activeIds = [...new Set(visibleEdges.flatMap(edge => [edge[0], edge[1]]))];
      const positions = calculateLayout(activeIds, visibleEdges);
      visibleEdges.forEach(edge => {
        const left = positions.get(edge[0]);
        const right = positions.get(edge[1]);
        const line = make('line', {
          x1: left.x,
          y1: left.y,
          x2: right.x,
          y2: right.y,
          'stroke-width': 1 + Math.min(edge[2], 12) * 0.7,
          class: 'network-edge'
        });
        line.dataset.left = edge[0];
        line.dataset.right = edge[1];
        edgeLayer.append(line);
      });
      activeIds.forEach(id => {
        const position = positions.get(id);
        const circle = make('circle', {
          cx: position.x,
          cy: position.y,
          r: radius(id),
          class: 'network-node' + (labelIds.has(id) ? '' : ' is-secondary'),
          'aria-label': nodes[id][0] + '，合作强度 ' + nodes[id][1]
        });
        circle.dataset.id = id;
        circle.addEventListener('pointerenter', () => showTooltip(id, circle));
        circle.addEventListener('pointerleave', () => { tooltip.style.visibility = 'hidden'; });
        circle.addEventListener('click', () => setFocus(selected === id ? null : id));
        nodeLayer.append(circle);
        if (labelIds.has(id)) {
          const label = make('text', {
            x: position.x + radius(id) + 4,
            y: position.y + 4,
            class: 'network-label text-small'
          });
          label.dataset.id = id;
          label.textContent = nodes[id][0];
          labelLayer.append(label);
        }
      });
      selection.textContent = '当前显示 ' + activeIds.length + ' 个节点、' + visibleEdges.length + ' 条合作边；点选节点可查看主要合作关系。';
      root.querySelectorAll('[data-threshold]').forEach(button => {
        button.setAttribute('aria-pressed', String(Number(button.dataset.threshold) === threshold));
      });
    }

    edges.slice(0, 10).forEach((edge, index) => {
      const row = document.createElement('tr');
      const years = edge[4] === edge[5] ? edge[4] : edge[4] + '–' + edge[5];
      row.innerHTML = '<td>' + (index + 1) + '</td><td>' + escapeHtml(nodes[edge[0]][0]) + ' ↔ ' + escapeHtml(nodes[edge[1]][0]) +
        '</td><td class="text-end">' + edge[2] + '</td><td class="text-end">' + edge[3] + '</td><td>' + years + '</td>';
      tableBody.append(row);
    });
    root.querySelectorAll('[data-threshold]').forEach(button => {
      button.addEventListener('click', () => {
        threshold = Number(button.dataset.threshold);
        render();
      });
    });
    render();
  })();
  </script>
</div>
